const pronunciations={"a":{"ipa":"ə","pt":"â"},"after":{"ipa":"æftɚ","pt":"éftêr"},"again":{"ipa":"əɡɛn","pt":"âguén"},"all":{"ipa":"ɔl","pt":"ól"},"an":{"ipa":"æn","pt":"én"},"and":{"ipa":"ənd","pt":"ând"},"another":{"ipa":"ənʌðɚ","pt":"ânâdhêr"},"at":{"ipa":"æt","pt":"ét"},"before":{"ipa":"bɪfɔɹ","pt":"bifór"},"behavior":{"ipa":"bɪheɪvjɚ","pt":"biheiviêr"},"cable":{"ipa":"keɪbəl","pt":"keibâl"},"call":{"ipa":"kɔl","pt":"kól"},"calls":{"ipa":"kɔlz","pt":"kólz"},"carefully":{"ipa":"kɛɹfəli","pt":"kérfâlí"},"change":{"ipa":"tʃeɪndʒ","pt":"tcheindj"},"checking":{"ipa":"tʃɛkɪŋ","pt":"tchéking"},"closing":{"ipa":"kloʊzɪŋ","pt":"klouzing"},"complete":{"ipa":"kəmplit","pt":"kâmplít"},"computer":{"ipa":"kəmpjutɚ","pt":"kâmpiútêr"},"connection":{"ipa":"kənɛkʃən","pt":"kânékshân"},"damaged":{"ipa":"dæmədʒd","pt":"démâdjd"},"device":{"ipa":"dɪvaɪs","pt":"divais"},"during":{"ipa":"dʊɹɪŋ","pt":"during"},"earlier":{"ipa":"ɝliɚ","pt":"êrlíêr"},"eight":{"ipa":"eɪt","pt":"eit"},"enough":{"ipa":"ɪnʌf","pt":"inâf"},"error":{"ipa":"ɛɹɚ","pt":"érêr"},"fail":{"ipa":"feɪl","pt":"feil"},"fault":{"ipa":"fɔlt","pt":"fólt"},"finish":{"ipa":"fɪnɪʃ","pt":"finish"},"finished":{"ipa":"fɪnɪʃt","pt":"finisht"},"fix":{"ipa":"fɪks","pt":"fiks"},"fixed":{"ipa":"fɪkst","pt":"fikst"},"for":{"ipa":"fɔɹ","pt":"fór"},"had":{"ipa":"hæd","pt":"héd"},"i":{"ipa":"aɪ","pt":"ai"},"if":{"ipa":"ɪf","pt":"if"},"inspect":{"ipa":"ɪnspɛkt","pt":"inspékt"},"inspection":{"ipa":"ɪnspɛkʃən","pt":"inspékshân"},"installation":{"ipa":"ɪnstəleɪʃən","pt":"instâleishân"},"installed":{"ipa":"ɪnstɔld","pt":"in-stóld"},"issue":{"ipa":"ɪʃu","pt":"ishú"},"it":{"ipa":"ɪt","pt":"it"},"jam":{"ipa":"dʒæm","pt":"djém"},"last":{"ipa":"læst","pt":"lést"},"late":{"ipa":"leɪt","pt":"leit"},"lights":{"ipa":"laɪts","pt":"laits"},"like":{"ipa":"laɪk","pt":"laik"},"loading":{"ipa":"loʊdɪŋ","pt":"louding"},"long":{"ipa":"lɔŋ","pt":"lóng"},"lunch":{"ipa":"lʌntʃ","pt":"lântch"},"machine":{"ipa":"məʃin","pt":"mâ-shín"},"machines":{"ipa":"məʃinz","pt":"mâshínz"},"manager":{"ipa":"mænədʒɚ","pt":"ménâdjêr"},"message":{"ipa":"mɛsədʒ","pt":"mésâdj"},"minutes":{"ipa":"mɪnəts","pt":"minâts"},"model":{"ipa":"mɑdəl","pt":"mádâl"},"morning":{"ipa":"mɔɹnɪŋ","pt":"mórning"},"network":{"ipa":"nɛtwɝk","pt":"nétuêrk"},"never":{"ipa":"nɛvɚ","pt":"névêr"},"new":{"ipa":"nu","pt":"nú"},"normally":{"ipa":"nɔɹməli","pt":"nórmâlí"},"notes":{"ipa":"noʊts","pt":"nouts"},"observed":{"ipa":"əbzɝvd","pt":"ob-zêrvd"},"on":{"ipa":"ɑn","pt":"án"},"once":{"ipa":"wʌns","pt":"uâns"},"outside":{"ipa":"aʊtsaɪd","pt":"autsaid"},"overnight":{"ipa":"oʊvɚnaɪt","pt":"ouvêrnait"},"paper":{"ipa":"peɪpɚ","pt":"peipêr"},"part":{"ipa":"pɑɹt","pt":"párt"},"parts":{"ipa":"pɑɹts","pt":"párts"},"perform":{"ipa":"pɚfɔɹm","pt":"pêrfórm"},"port":{"ipa":"pɔɹt","pt":"pórt"},"printer":{"ipa":"pɹɪntɚ","pt":"prín-ter"},"problem":{"ipa":"pɹɑbləm","pt":"práblâm"},"process":{"ipa":"pɹɑsɛs","pt":"prásés"},"ran":{"ipa":"ɹæn","pt":"rén"},"reboot":{"ipa":"ɹibut","pt":"ríbút"},"rebooted":{"ipa":"ɹibutɪd","pt":"ri-bú-tid"},"repair":{"ipa":"ɹɪpɛɹ","pt":"ripér"},"repaired":{"ipa":"ɹɪpɛɹd","pt":"ri-pérd"},"replacement":{"ipa":"ɹɪpleɪsmənt","pt":"ripleismânt"},"replacing":{"ipa":"ɹɪpleɪsɪŋ","pt":"ripleising"},"reset":{"ipa":"ɹisɛt","pt":"rísét"},"resolved":{"ipa":"ɹizɑlvd","pt":"rízálvd"},"respond":{"ipa":"ɹɪspɑnd","pt":"rispánd"},"restart":{"ipa":"ɹistɑɹt","pt":"rístárt"},"restarted":{"ipa":"ɹistɑɹtɪd","pt":"ri-stár-tid"},"router":{"ipa":"ɹutɚ","pt":"ráu-ter"},"running":{"ipa":"ɹʌnɪŋ","pt":"râning"},"same":{"ipa":"seɪm","pt":"seim"},"scanner":{"ipa":"skænɚ","pt":"skénêr"},"screen":{"ipa":"skɹin","pt":"skrín"},"see":{"ipa":"si","pt":"sí"},"seen":{"ipa":"sin","pt":"sín"},"service":{"ipa":"sɝvəs","pt":"sêrvâs"},"several":{"ipa":"sɛvɹəl","pt":"sévrâl"},"similar":{"ipa":"sɪməlɚ","pt":"simâlêr"},"software":{"ipa":"sɔftwɛɹ","pt":"sóftuér"},"stabilized":{"ipa":"steɪbəlaɪzd","pt":"steibâlaizd"},"stabilizing":{"ipa":"steɪbəlaɪzɪŋ","pt":"steibâlaizing"},"started":{"ipa":"stɑɹtɪd","pt":"stártid"},"status":{"ipa":"stætəs","pt":"stétâs"},"store":{"ipa":"stɔɹ","pt":"stór"},"successfully":{"ipa":"səksɛsfəli","pt":"sâksésfâlí"},"system":{"ipa":"sɪstəm","pt":"sistâm"},"technician":{"ipa":"tɛknɪʃən","pt":"tek-ní-shân"},"ten":{"ipa":"tɛn","pt":"tén"},"terminal":{"ipa":"tɝmənəl","pt":"têrmânâl"},"test":{"ipa":"tɛst","pt":"tést"},"tested":{"ipa":"tɛstɪd","pt":"téstid"},"testing":{"ipa":"tɛstɪŋ","pt":"tésting"},"that":{"ipa":"ðæt","pt":"dhét"},"the":{"ipa":"ðə","pt":"dhâ"},"there":{"ipa":"ðɛɹ","pt":"dhér"},"they":{"ipa":"ðeɪ","pt":"dhei"},"this":{"ipa":"ðɪs","pt":"dhis"},"three":{"ipa":"θɹi","pt":"thrí"},"time":{"ipa":"taɪm","pt":"taim"},"times":{"ipa":"taɪmz","pt":"taimz"},"to":{"ipa":"tu","pt":"tú"},"together":{"ipa":"təɡɛðɚ","pt":"tâguédhêr"},"took":{"ipa":"tʊk","pt":"tuk"},"twice":{"ipa":"twaɪs","pt":"tuais"},"unexpectedly":{"ipa":"ʌnɪkspɛktɪdli","pt":"ânikspéktidlí"},"unit":{"ipa":"junət","pt":"iúnât"},"until":{"ipa":"əntɪl","pt":"ân-tíl"},"unusual":{"ipa":"ənjuʒuəl","pt":"âniújúâl"},"update":{"ipa":"əpdeɪt","pt":"âpdeit"},"wait":{"ipa":"weɪt","pt":"ueit"},"waited":{"ipa":"weɪtɪd","pt":"uêi-tid"},"warning":{"ipa":"wɔɹnɪŋ","pt":"uórning"},"was":{"ipa":"wɑz","pt":"uáz"},"watched":{"ipa":"wɑtʃt","pt":"uótcht"},"watching":{"ipa":"wɑtʃɪŋ","pt":"uátching"},"we":{"ipa":"wi","pt":"uí"},"week":{"ipa":"wik","pt":"uík"},"while":{"ipa":"waɪl","pt":"uail"},"with":{"ipa":"wɪð","pt":"uidh"},"without":{"ipa":"wɪθaʊt","pt":"uithaut"},"work":{"ipa":"wɝk","pt":"uêrk"},"worked":{"ipa":"wɝkt","pt":"uêrkt"},"working":{"ipa":"wɝkɪŋ","pt":"uêrking"},"would":{"ipa":"wʊd","pt":"uud"},"yesterday":{"ipa":"jɛstɚdeɪ","pt":"iéstêrdei"}};
const defaultIntervals=[{value:15,unit:'minutes',enabled:true},{value:1,unit:'days',enabled:true},{value:3,unit:'days',enabled:true}];
const KEY='english-coach-v2';
let state={lang:'pt',page:'home',current:0,selected:null,rating:{},wordRating:{},intervals:defaultIntervals,difficult:[],practiceVerb:null};
try{let old=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...old,page:'home',selected:null}}catch(e){}
state.intervals=Array.isArray(state.intervals)&&state.intervals.length===3?state.intervals:defaultIntervals.map(x=>({...x}));
state.wordRating=state.wordRating||{};
const $=id=>document.getElementById(id);
const tr=(pt,en)=>state.lang==='pt'?pt:en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify({...state,selected:null}))}
function go(p){state.page=p;state.selected=null;state.practiceVerb=null;save();render()}
function due(id){let r=state.rating[id];return !r||(Number.isFinite(r.next)&&r.next<=Date.now())}
function countDue(){return cards.filter(c=>due(c.id)).length}
function cardView(c){let words=c.text.match(/\S+/g)||[];let chosen=state.selected;return '<div class="card"><div class="row spread"><span class="chip">'+tr('Frase','Sentence')+' '+(c.id+1)+' / 100</span><span class="muted small">'+verbs[c.verb].past+'</span></div><div class="phrase">'+words.map((w,i)=>'<button class="word '+(chosen===i?'active':'')+'" onclick="pick('+i+')" aria-label="'+esc(w)+'">'+esc(w)+'</button>').join(' ')+'</div><div class="row"><button onclick="speak('+JSON.stringify(c.text).replace(/"/g,'&quot;')+')">▶ '+tr('Ouvir frase','Listen')+'</button><button onclick="toggleTranslation()">'+tr('Tradução / dica','Translation / hint')+'</button></div><div id="translation" class="muted small hide">'+tr('Toque em uma palavra para consultar a pronúncia. Pratique falando a frase em voz alta.','Tap a word for pronunciation. Practice speaking aloud.')+'</div>'+selectedView(c)+'</div><div class="card"><h2>'+tr('Como foi essa frase?','How was this sentence?')+'</h2><div class="row"><button class="choice danger" onclick="rate('+c.id+',0)">'+tr('Difícil','Hard')+'</button><button class="choice" onclick="rate('+c.id+',1)">'+tr('Médio','Medium')+'</button><button class="choice green" onclick="rate('+c.id+',2)">'+tr('Fácil','Easy')+'</button></div><p class="notice">'+intervalSummary()+'</p></div><div class="row spread"><button onclick="next(-1)">← '+tr('Anterior','Previous')+'</button><button class="primary" onclick="next(1)">'+tr('Próxima','Next')+' →</button></div>'}
function selectedView(c){if(state.selected===null)return '';let word=c.text.match(/\S+/g)[state.selected].replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g,'');let v=verbs.find(x=>x.past.toLowerCase()===word.toLowerCase()||x.alt.toLowerCase()===word.toLowerCase());let ph=pronunciations[word.toLowerCase()];return '<div class="detail"><div class="muted small">'+tr('Palavra selecionada','Selected word')+'</div><h2>'+esc(word)+'</h2><p>'+tr('Fonética aproximada','Approximate pronunciation')+': <b>'+esc(ph?ph.pt:'—')+'</b></p><p>IPA: <b>/'+esc(ph?ph.ipa:'')+'/</b></p><div class="row"><button onclick="speak('+JSON.stringify(word).replace(/"/g,'&quot;')+')">▶ '+tr('Ouvir palavra','Listen to word')+'</button>'+(v?'<button class="primary" onclick="markVerb('+verbs.indexOf(v)+')">★ '+tr('Marcar verbo difícil','Mark difficult verb')+'</button>':'')+'</div>'+(v?'<p class="muted small">'+esc(v.meaning)+'</p>':'<p class="notice">'+tr('A escrita em português é apenas um apoio. Ouça o áudio para conferir os sons do inglês.','The Portuguese spelling is only a learning aid. Listen to the audio for English sounds.')+'</p>')+wordReviewControls(word.toLowerCase(),c.id)+'</div>'}
function pick(i){state.selected=i;render()}
function toggleTranslation(){let x=$('translation');if(x)x.classList.toggle('hide')}
function speak(s){if(window.Capacitor&&Capacitor.isNativePlatform()){Capacitor.Plugins.TextToSpeech.speak({text:s,lang:'en-US',rate:.85,pitch:1,volume:1,category:'playback'}).catch(()=>alert('Instale uma voz em inglês nas configurações de texto para voz do Android.'));return}if(!window.speechSynthesis){alert(tr('Voz do dispositivo indisponível.','Device speech unavailable.'));return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-CA';u.rate=.85;speechSynthesis.speak(u)}
function next(n){state.current=(state.current+n+cards.length)%cards.length;state.selected=null;save();render()}
function schedule(level){let cfg=state.intervals[level];return cfg.enabled?Date.now()+cfg.value*({minutes:60000,hours:3600000,days:86400000}[cfg.unit]):null}
function levelName(n){return [tr('Difícil','Hard'),tr('Médio','Medium'),tr('Fácil','Easy')][n]}
function durationLabel(cfg){if(!cfg.enabled)return tr('Não retornar','Do not repeat');let units={minutes:tr('minutos','minutes'),hours:tr('horas','hours'),days:tr('dias','days')};return cfg.value+' '+units[cfg.unit]}
function intervalSummary(){return state.intervals.map((c,i)=>levelName(i)+': '+durationLabel(c)).join(' · ')}
function rate(id,level){let old=state.rating[id]||{reps:0};state.rating[id]={level,reps:old.reps+1,ratedAt:Date.now(),next:schedule(level)};let current=cards[id];if(level===0&&!state.difficult.includes(current.verb))state.difficult.push(current.verb);if(state.practiceVerb!==null){let arr=cards.filter(c=>c.verb===state.practiceVerb);state.current=arr[(arr.findIndex(c=>c.id===id)+1)%arr.length].id}else{let arr=cards.filter(c=>due(c.id)&&c.id!==id);state.current=arr.length?arr[0].id:(id+1)%100}state.selected=null;save();render()}
function wordReviewControls(word,card){let record=state.wordRating[word];return '<hr><p><b>'+tr('Revisar esta palavra','Review this word')+'</b></p><div class="row">'+[0,1,2].map(n=>'<button onclick="rateWord(\''+word+'\','+card+','+n+')">'+levelName(n)+'</button>').join('')+'</div>'+(record?'<p class="notice">'+(record.next===null?tr('Sem retorno automático','No automatic repeat'):tr('Próxima revisão: ','Next review: ')+new Date(record.next).toLocaleString(state.lang==='pt'?'pt-BR':'en-CA'))+'</p>':'')}
function rateWord(word,card,level){state.wordRating[word]={card,level,ratedAt:Date.now(),next:schedule(level)};save();render()}
function openWord(word,card){state.current=card;state.page='study';state.selected=cards[card].text.match(/\S+/g).findIndex(w=>w.replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g,'').toLowerCase()===word);save();render()}
function settingsView(){return '<div class="card"><h2>'+tr('Configurações de revisão','Review settings')+'</h2><p>'+tr('Escolha quando cada palavra ou frase deve voltar. Os intervalos são fixos para cada avaliação.','Choose when each word or sentence returns. Each rating uses its fixed interval.')+'</p><form onsubmit="saveSettings(event)">'+state.intervals.map((cfg,i)=>'<fieldset style="border:1px solid #d5dce6;border-radius:12px;margin:15px 0;padding:15px"><legend>'+levelName(i)+'</legend><label><input style="width:auto" type="checkbox" id="enabled'+i+'" '+(cfg.enabled?'checked':'')+' onchange="toggleInterval('+i+')"> '+tr('Retornar para revisão','Return for review')+'</label><div class="row" style="margin-top:12px"><label style="flex:1">'+tr('Intervalo','Interval')+'<input type="number" id="value'+i+'" min="1" max="10000" step="1" value="'+cfg.value+'" '+(!cfg.enabled?'disabled':'')+' required></label><label>'+tr('Unidade','Unit')+'<select id="unit'+i+'" '+(!cfg.enabled?'disabled':'')+'>'+['minutes','hours','days'].map(u=>'<option value="'+u+'" '+(cfg.unit===u?'selected':'')+'>'+({minutes:tr('Minutos','Minutes'),hours:tr('Horas','Hours'),days:tr('Dias','Days')})[u]+'</option>').join('')+'</select></label></div></fieldset>').join('')+'<label><input type="checkbox" id="reschedule" style="width:auto"> '+tr('Reagendar também as revisões já salvas, contando a partir de agora','Reschedule existing reviews from now')+'</label><p class="notice">'+tr('Sem marcar, a regra muda somente nas próximas avaliações. As revisões aparecem dentro do app; não são notificações do celular.','Unchecked, changes apply to future ratings only. Reviews appear in the app; these are not phone notifications.')+'</p><button class="primary" type="submit">'+tr('Salvar configurações','Save settings')+'</button><p id="settingsStatus" role="status"></p></form></div>'}
function toggleInterval(i){let disabled=!$('enabled'+i).checked;$('value'+i).disabled=disabled;$('unit'+i).disabled=disabled}
function saveSettings(event){event.preventDefault();let values=state.intervals.map((cfg,i)=>({value:Number($('value'+i).value),unit:$('unit'+i).value,enabled:$('enabled'+i).checked}));if(values.some(x=>!Number.isInteger(x.value)||x.value<1||x.value>10000||!['minutes','hours','days'].includes(x.unit)))return;state.intervals=values;if($('reschedule').checked){[state.rating,state.wordRating].forEach(records=>Object.values(records).forEach(r=>{r.next=schedule(r.level);r.ratedAt=Date.now()}))}save();render();$('settingsStatus').textContent=tr('Configurações salvas.','Settings saved.')}
function markVerb(v){if(!state.difficult.includes(v))state.difficult.push(v);state.practiceVerb=v;state.current=cards.find(c=>c.verb===v).id;state.selected=null;save();render()}
function practice(v){state.practiceVerb=v;state.current=cards.find(c=>c.verb===v).id;state.page='study';state.selected=null;save();render()}
function unmark(v){state.difficult=state.difficult.filter(x=>x!==v);save();render()}
function render(){document.documentElement.lang=state.lang==='pt'?'pt-BR':'en';$('language').value=state.lang;document.querySelectorAll('[data-label]').forEach(x=>x.textContent=({home:tr('Início','Home'),study:tr('Frases','Sentences'),review:tr('Revisões','Reviews'),verbs:tr('Verbos','Verbs'),settings:tr('Configurações','Settings')})[x.dataset.label]);let a=$('app');if(state.page==='home'){let done=Object.keys(state.rating).length;a.innerHTML='<div class="card"><h2>'+tr('Seu treino de inglês','Your English practice')+'</h2><p class="muted">'+tr('Frases técnicas, verbos no passado e repetição espaçada.','Technical sentences, past tense verbs and spaced repetition.')+'</p><div class="progress"><span style="width:'+done+'%"></span></div><p>'+done+'/100 '+tr('frases praticadas','sentences practiced')+'</p><p><b>'+countDue()+'</b> '+tr('frases disponíveis para revisão','sentences ready for review')+'</p><button class="primary" onclick="go(\'study\')">'+tr('Começar prática','Start practice')+'</button></div><div class="card"><h2>'+tr('Como funciona','How it works')+'</h2><p>'+tr('Toque na palavra para ver a fonética. Marque um verbo difícil para receber outras frases com ele. Avalie cada frase para agendar revisões.','Tap a word to see phonetics. Mark a difficult verb to get more examples. Rate each sentence to schedule reviews.')+'</p><p class="notice">'+tr('Tudo é salvo neste aparelho. A análise automática da pronúncia ainda não está disponível nesta versão. O áudio depende das vozes instaladas no Android.','Everything is saved on this device. Automatic pronunciation scoring is not yet available. Audio depends on installed Android voices.')+'</p></div>'}
else if(state.page==='study'){let c=cards[state.current];a.innerHTML=(state.practiceVerb!==null?'<div class="card"><div class="row spread"><b>'+tr('Treino intensivo: ','Focused practice: ')+verbs[state.practiceVerb].past+'</b><button onclick="state.practiceVerb=null;save();render()">'+tr('Sair','Exit')+'</button></div></div>':'')+cardView(c)}
else if(state.page==='settings'){a.innerHTML=settingsView()}
else if(state.page==='review'){let dueCards=cards.filter(c=>due(c.id)&&state.rating[c.id]);let dueWords=Object.entries(state.wordRating).filter(([w,r])=>Number.isFinite(r.next)&&r.next<=Date.now());a.innerHTML='<div class="card"><h2>'+tr('Revisões programadas','Scheduled reviews')+'</h2><h3>'+tr('Palavras','Words')+'</h3>'+ (dueWords.length?dueWords.map(([w,r])=>'<p><button onclick="openWord(\''+w+'\','+r.card+')">'+esc(w)+'</button></p>').join(''):tr('Nenhuma palavra pendente.','No words due.'))+'<h3>'+tr('Frases','Sentences')+'</h3><p>'+dueCards.length+' '+tr('frases para revisar agora','sentences to review now')+'</p>'+(dueCards.length?dueCards.slice(0,30).map(c=>'<p><button onclick="state.current='+c.id+';state.page=\'study\';state.selected=null;save();render()">'+esc(c.text)+'</button></p>').join(''):'<p>'+tr('Nenhuma revisão pendente.','No reviews due.')+'</p>')+'</div>'}
else if(state.page==='verbs'){a.innerHTML='<div class="card"><h2>'+tr('Verbos difíceis','Difficult verbs')+'</h2><p class="muted small">'+tr('Toque em Praticar para ver 10 frases diferentes com o verbo.','Tap Practice to see 10 different sentences with each verb.')+'</p>'+verbs.map((v,i)=>'<div class="row spread" style="border-top:1px solid #edf0f4;padding:13px 0"><div><b>'+v.past+'</b><div class="muted small">'+v.phon+' · '+v.meaning+'</div></div><div class="row"><button onclick="practice('+i+')">'+tr('Praticar','Practice')+'</button>'+(state.difficult.includes(i)?'<button onclick="unmark('+i+')">★</button>':'<button onclick="markVerb('+i+')">☆</button>')+'</div></div>').join('')+'</div>'}}
setInterval(()=>{if(state.page==='review'||state.page==='home')render()},30000);
render();
</script></body></html>
