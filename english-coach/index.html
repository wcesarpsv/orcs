<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Coach</title><style>body{font:16px system-ui;background:#f7f8fb;color:#172033;margin:0}header{background:#fff;padding:22px;border-bottom:1px solid #ddd}main{max-width:640px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e2e5eb;border-radius:18px;padding:20px;margin:14px 0}button,select{font:inherit;padding:12px;border-radius:12px;border:1px solid #bfc6d2;background:white;margin:4px}button.primary{background:#172033;color:white}small{color:#596579}.phrase{font-size:22px;line-height:1.5}.token{display:inline-block;padding:3px;border-bottom:1px dashed #adb5c2;cursor:pointer}.hidden{display:none}nav{display:flex;flex-wrap:wrap;gap:5px}textarea{width:95%;min-height:85px;font:inherit;padding:10px}#detail{position:fixed;inset:0;overflow:auto;background:#fff;padding:24px;z-index:5}#detail.hidden{display:none}</style></head><body><header><b>English Coach</b> <small>· Canadian English</small><div><select id="lang" onchange="render()"><option value="en">English</option><option value="pt">Português</option></select></div></header><main><nav><button onclick="page='home';render()">Home</button><button onclick="page='test';render()">Placement</button><button onclick="page='lesson';render()">Lessons</button><button onclick="page='review';render()">Reviews</button></nav><div id="content"></div></main><section id="detail" class="hidden"></section><script>
const phrases=[{en:"I'm still investigating the issue.",pt:"Ainda estou investigando o problema.",sound:"Aim stil invéstigueitin dhi íshu.",tip:"Present continuous: an action happening now."},{en:"I need to figure out what's wrong.",pt:"Preciso descobrir o que está errado.",sound:"Ai níid tu fíguer áut uóts róng.",tip:"Figure out is a phrasal verb meaning discover or understand."},{en:"Could you give me a heads-up?",pt:"Você poderia me avisar com antecedência?",sound:"Cúd iú guív mi a réd-zâp?",tip:"Could you is a polite request."},{en:"The machine keeps restarting itself.",pt:"A máquina continua reiniciando sozinha.",sound:"Dâ mashín kíips ristártin itsélf.",tip:"Keep + verb-ing describes repeated behavior."}];
let page='home',idx=0,showPt=true,speed=1,score=0,q=0;const saved=JSON.parse(localStorage.getItem('ec_saved')||'[]');const t=(en,pt)=>document.getElementById('lang').value==='pt'?pt:en;const el=()=>document.getElementById('content');const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function speak(s){if(!('speechSynthesis'in window))return alert('Audio unavailable');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='en-CA';u.rate=speed;speechSynthesis.speak(u)}function render(){if(page==='home')el().innerHTML='<div class="card"><h2>'+t('Your English journey','Sua jornada de inglês')+'</h2><p>B1 · Listening + Speaking</p><button class="primary" onclick="page=\'lesson\';render()">'+t('Start learning','Começar')+'</button></div><div class="card">'+t('Tap a word or select a sentence during a lesson to explain it.','Toque em uma palavra ou selecione uma frase durante a lição para explicá-la.')+'</div>';if(page==='lesson'){let p=phrases[idx];el().innerHTML='<div class="card"><small>Lesson '+(idx+1)+' / '+phrases.length+'</small><p class="phrase" id="phrase">'+p.en.split(' ').map((w,i)=>'<span class="token" onclick="explain('+idx+','+i+')">'+escapeHtml(w)+'</span>').join(' ')+'</p><button onclick="explain('+idx+',-1)">'+t('Explain sentence','Explicar frase')+'</button><button onclick="showPt=!showPt;render()">'+t('Translation on/off','Mostrar/ocultar tradução')+'</button>'+(showPt?'<p>'+escapeHtml(p.pt)+'</p><small>'+escapeHtml(p.sound)+'</small>':'')+'<p><button onclick="speak(phrases[idx].en)">▶ '+t('Listen','Ouvir')+'</button><select onchange="speed=Number(this.value)"><option value="1">1x</option><option value="0.75">0.75x</option><option value="1.25">1.25x</option></select></p><button onclick="idx=(idx+1)%phrases.length;render()">'+t('Next','Próxima')+'</button></div><div class="card"><h3>'+t('Paste your own sentence','Cole sua frase')+'</h3><textarea id="custom"></textarea><button onclick="explainCustom()">'+t('Explain','Explicar')+'</button></div>';}if(page==='review')el().innerHTML='<div class="card"><h2>'+t('Saved words and phrases','Palavras e frases salvas')+'</h2>'+(saved.length?saved.map(x=>'<p>'+escapeHtml(x)+'</p>').join(''):t('Nothing saved yet','Nada salvo ainda'))+'</div>';if(page==='test'){const questions=[['She ___ to work every day.',['go','goes','going'],1],['I have lived here ___ 2020.',['for','since','during'],1],['If I had more time, I ___ study.',['will','would','have'],1]];let item=questions[q%questions.length];el().innerHTML='<div class="card"><h2>'+t('Placement test','Teste de nivelamento')+'</h2><p>'+escapeHtml(item[0])+'</p>'+item[1].map((a,i)=>'<p><button onclick="answer('+i+')">'+escapeHtml(a)+'</button></p>').join('')+'<small>'+t('Correct answers','Acertos')+': '+score+' / '+q+'</small></div>';}}function answer(i){const ans=[1,1,1][q%3];if(i===ans)score++;q++;if(q>=3){el().innerHTML='<div class="card"><h2>'+t('Test complete','Teste concluído')+'</h2><p>'+score+' / 3</p><p>'+t('This short sample is not a complete level assessment.','Esta amostra curta não é uma avaliação completa.')+'</p><button onclick="page=\'lesson\';render()">'+t('Start lessons','Começar aulas')+'</button></div>';return}render()}function openDetail(title,meaning,tip){document.getElementById('detail').classList.remove('hidden');document.getElementById('detail').innerHTML='<button onclick="document.getElementById(\'detail\').classList.add(\'hidden\')">← Back</button><h2>'+escapeHtml(title)+'</h2><p>'+escapeHtml(meaning)+'</p><button onclick="speak('+JSON.stringify(title).replace(/"/g,'&quot;')+')">▶ Listen</button><h3>Grammar & usage</h3><p>'+escapeHtml(tip)+'</p><button class="primary" onclick="save('+JSON.stringify(title).replace(/"/g,'&quot;')+')">Save for review</button><p><small>More AI-generated examples will be added in a future version.</small></p>'}function explain(i,w){let p=phrases[i],word=w<0?p.en:p.en.split(' ')[w];openDetail(word,w<0?p.pt:'Word in context: '+p.pt,p.tip)}function explainCustom(){let s=document.getElementById('custom').value.trim();if(s)openDetail(s,'Custom text','Detailed AI explanations are planned for a later version.')}function save(s){if(!saved.includes(s))saved.push(s);localStorage.setItem('ec_saved',JSON.stringify(saved));alert(t('Saved','Salvo'))}render();</script></body></html>
