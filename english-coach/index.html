<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>English Coach</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#152237;background:#f6f7fa}*{box-sizing:border-box}body{margin:0}header{padding:24px 20px 14px;background:white;border-bottom:1px solid #e4e8ef}main{max-width:720px;margin:auto;padding:16px 16px 90px}.muted{color:#66748a}.small{font-size:13px}.card{background:white;border:1px solid #e4e8ef;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 2px 10px #182b3b06}button,select{font:inherit;border-radius:12px;padding:11px 14px;border:1px solid #d5dce6;background:#fff;color:#17263c;cursor:pointer}button:disabled{opacity:.45}.primary{background:#173b68;color:white;border-color:#173b68}button:focus-visible{outline:3px solid #7daff7}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.tabs button{white-space:nowrap}.phrase{font-size:24px;line-height:1.85;margin:15px 0}.word{border:0;border-bottom:2px dotted #bcc8d8;background:transparent;border-radius:3px;padding:0 2px;font-size:inherit;line-height:inherit}.word.active{background:#e1edfc;border-bottom-color:#245b9c}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.detail{background:#eff5ff;padding:16px;border-radius:16px;margin:12px 0}.detail h2{margin:4px 0}.chip{border-radius:99px;background:#e9eef6;padding:5px 11px;font-size:12px}.progress{height:8px;background:#e5eaf2;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:#3b76b4}.choice{flex:1;min-width:90px}.danger{border-color:#e5b8b8;color:#9a2b2b}.green{border-color:#b9dacb;color:#27694c}.notice{font-size:13px;color:#637087;line-height:1.5}h1{font-size:23px;margin:0 0 6px}h2{font-size:19px;margin:5px 0 12px}p{line-height:1.5}input{padding:11px;border:1px solid #d5dce6;border-radius:12px;width:100%;font:inherit}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e8ed;padding:10px;display:flex;justify-content:center;gap:8px}footer button{font-size:13px;padding:10px} .hide{display:none}
</style></head><body><header><div class="row spread"><div><h1>English Coach</h1><div class="muted small">Offline · English practice</div></div><select id="language" aria-label="Idioma" onchange="state.lang=this.value;save();render()"><option value="pt">Português</option><option value="en">English</option></select></div></header><main id="app"></main><footer><button onclick="go('home')">⌂ <span data-label="home">Início</span></button><button onclick="go('study')">▤ <span data-label="study">Frases</span></button><button onclick="go('review')">↻ <span data-label="review">Revisões</span></button><button onclick="go('verbs')">★ <span data-label="verbs">Verbos</span></button></footer><script>
'use strict';
const verbs=[
{base:'wait',past:'waited',phon:'uêi-tid',meaning:'esperar',stem:'waited',alt:'wait'},
{base:'work',past:'worked',phon:'uêrkt',meaning:'trabalhar',stem:'worked',alt:'work'},
{base:'fix',past:'fixed',phon:'fikst',meaning:'consertar',stem:'fixed',alt:'fix'},
{base:'watch',past:'watched',phon:'uótcht',meaning:'observar',stem:'watched',alt:'watch'},
{base:'reboot',past:'rebooted',phon:'ri-bú-tid',meaning:'reiniciar',stem:'rebooted',alt:'reboot'},
{base:'install',past:'installed',phon:'in-stóld',meaning:'instalar',stem:'installed',alt:'install'},
{base:'repair',past:'repaired',phon:'ri-pérd',meaning:'reparar',stem:'repaired',alt:'repair'},
{base:'observe',past:'observed',phon:'ob-zêrvd',meaning:'observar',stem:'observed',alt:'observe'},
{base:'see',past:'seen',phon:'sín',meaning:'ver (particípio)',stem:'seen',alt:'saw'},
{base:'have',past:'had',phon:'héd',meaning:'ter (passado)',stem:'had',alt:'have'}];
const sentenceSets=[
['Yesterday, I waited for ten minutes.','I waited until the machine restarted.','We waited for the manager.','I waited outside the store.','The technician waited for an update.','I had never waited that long before.','I waited while the system was loading.','They waited for the network connection.','I waited for the printer to respond.','I waited to see if it would work.'],
['I worked at that store yesterday.','I worked on the machine all morning.','I had never worked there before.','We worked together on the repair.','I worked until the problem was resolved.','The printer worked after the restart.','I worked on three service calls.','I worked late yesterday.','The network worked normally after the fix.','I worked while the manager watched.'],
['I fixed the machine yesterday.','I fixed the network cable.','We fixed the printer issue.','I had never fixed that model before.','The technician fixed the connection.','I fixed it after checking the router.','I fixed the problem before lunch.','I fixed the scanner this morning.','I fixed the issue without replacing parts.','I fixed the machine and tested it.'],
['I watched the machine for ten minutes.','I watched the screen during the reboot.','I watched it while the system restarted.','I watched the printer complete a test.','We watched the machine carefully.','I watched the status lights change.','I watched the router after the reset.','I watched the machine until it stabilized.','I had never watched that process before.','I watched the technician perform the test.'],
['The machine rebooted again.','It rebooted eight times yesterday.','The system rebooted after the update.','The machine rebooted while I was watching.','It rebooted before the test finished.','The terminal rebooted unexpectedly.','The router rebooted overnight.','The machine rebooted and started working.','The computer rebooted after installation.','It rebooted several times before stabilizing.'],
['I installed a new printer.','I installed the replacement scanner.','We installed the machine yesterday.','I had never installed that model before.','The technician installed the cable.','I installed the update successfully.','I installed the router at the store.','I installed the device and tested it.','I installed new software on the terminal.','I installed the replacement part carefully.'],
['I repaired the machine yesterday.','I repaired the damaged cable.','We repaired the printer connection.','I had never repaired that model before.','The technician repaired the network port.','I repaired the issue before closing.','I repaired the machine without new parts.','I repaired the scanner connection.','I repaired the unit and ran a test.','I repaired the fault after inspection.'],
['I observed the machine after the reboot.','I observed the screen for several minutes.','We observed the system during testing.','I observed an unusual error message.','The technician observed the problem.','I observed the printer while it was running.','I observed the network connection.','I observed the machine until it stabilized.','I observed the same issue yesterday.','I observed the behavior and took notes.'],
['I had never seen that problem before.','I had seen that error once before.','We had seen a similar issue last week.','I had never seen the machine reboot like that.','I had seen the warning on another unit.','I had never seen that model before.','The manager had seen the error earlier.','I had seen the same behavior yesterday.','I had never seen that screen before.','I had seen the printer fail during testing.'],
['I had a service call yesterday.','I had three machines to inspect.','We had a network issue at the store.','I had never had that problem before.','The machine had a damaged cable.','I had to wait for the manager.','I had enough time to finish the test.','The printer had a paper jam.','I had a problem with the scanner.','I had to reboot the machine twice.']
];
const cards=sentenceSets.flatMap((arr,v)=>arr.map((text,j)=>({id:v*10+j,verb:v,text})));
const KEY='english-coach-v2';
let state={lang:'pt',page:'home',current:0,selected:null,rating:{},difficult:[],practiceVerb:null};
try{let old=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...old,page:'home',selected:null}}catch(e){}
const $=id=>document.getElementById(id);
const tr=(pt,en)=>state.lang==='pt'?pt:en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify({...state,selected:null}))}
function go(p){state.page=p;state.selected=null;state.practiceVerb=null;save();render()}
function due(id){let r=state.rating[id];return !r||r.next<=Date.now()}
function countDue(){return cards.filter(c=>due(c.id)).length}
function cardView(c){let words=c.text.match(/\S+/g)||[];let chosen=state.selected;return '<div class="card"><div class="row spread"><span class="chip">'+tr('Frase','Sentence')+' '+(c.id+1)+' / 100</span><span class="muted small">'+verbs[c.verb].past+'</span></div><div class="phrase">'+words.map((w,i)=>'<button class="word '+(chosen===i?'active':'')+'" onclick="pick('+i+')" aria-label="'+esc(w)+'">'+esc(w)+'</button>').join(' ')+'</div><div class="row"><button onclick="speak('+JSON.stringify(c.text).replace(/"/g,'&quot;')+')">▶ '+tr('Ouvir frase','Listen')+'</button><button onclick="toggleTranslation()">'+tr('Tradução / dica','Translation / hint')+'</button></div><div id="translation" class="muted small hide">'+tr('Toque em uma palavra para consultar a pronúncia. Pratique falando a frase em voz alta.','Tap a word for pronunciation. Practice speaking aloud.')+'</div>'+selectedView(c)+'</div><div class="card"><h2>'+tr('Como foi essa frase?','How was this sentence?')+'</h2><div class="row"><button class="choice danger" onclick="rate('+c.id+',0)">'+tr('Difícil','Hard')+'</button><button class="choice" onclick="rate('+c.id+',1)">'+tr('Fácil','Easy')+'</button><button class="choice green" onclick="rate('+c.id+',2)">'+tr('Muito fácil','Very easy')+'</button></div><p class="notice">'+tr('Difícil: amanhã · Fácil: em 3 dias · Muito fácil: em 7 dias. As revisões seguintes aumentam os intervalos.','Hard: tomorrow · Easy: 3 days · Very easy: 7 days. Later reviews extend the intervals.')+'</p></div><div class="row spread"><button onclick="next(-1)">← '+tr('Anterior','Previous')+'</button><button class="primary" onclick="next(1)">'+tr('Próxima','Next')+' →</button></div>'}
function selectedView(c){if(state.selected===null)return '';let word=c.text.match(/\S+/g)[state.selected].replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g,'');let v=verbs.find(x=>x.past.toLowerCase()===word.toLowerCase()||x.alt.toLowerCase()===word.toLowerCase());let ph=v?v.phon:'—';return '<div class="detail"><div class="muted small">'+tr('Palavra selecionada','Selected word')+'</div><h2>'+esc(word)+'</h2><p>'+tr('Fonética aproximada','Approximate pronunciation')+': <b>'+esc(ph)+'</b></p><div class="row"><button onclick="speak('+JSON.stringify(word).replace(/"/g,'&quot;')+')">▶ '+tr('Ouvir palavra','Listen to word')+'</button>'+(v?'<button class="primary" onclick="markVerb('+verbs.indexOf(v)+')">★ '+tr('Marcar verbo difícil','Mark difficult verb')+'</button>':'')+'</div>'+(v?'<p class="muted small">'+esc(v.meaning)+'</p>':'<p class="notice">'+tr('Fonética em português disponível inicialmente para os 10 verbos principais.','Portuguese phonetics currently available for the 10 target verbs.')+'</p>')+'</div>'}
function pick(i){state.selected=i;render()}
function toggleTranslation(){let x=$('translation');if(x)x.classList.toggle('hide')}
function speak(s){if(!window.speechSynthesis){alert(tr('Voz do dispositivo indisponível.','Device speech unavailable.'));return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-CA';u.rate=.85;speechSynthesis.speak(u)}
function next(n){state.current=(state.current+n+cards.length)%cards.length;state.selected=null;save();render()}
function rate(id,level){let old=state.rating[id]||{reps:0};let reps=level===0?0:old.reps+1;let days=level===0?1:level===1?Math.min(60,3*Math.pow(2,reps-1)):Math.min(120,7*Math.pow(2,reps-1));state.rating[id]={level,reps,next:Date.now()+days*86400000};let current=cards[id];if(level===0&&!state.difficult.includes(current.verb))state.difficult.push(current.verb);if(state.practiceVerb!==null){let arr=cards.filter(c=>c.verb===state.practiceVerb);state.current=arr[(arr.findIndex(c=>c.id===id)+1)%arr.length].id}else{let arr=cards.filter(c=>due(c.id)&&c.id!==id);state.current=arr.length?arr[0].id:(id+1)%100}state.selected=null;save();render()}
function markVerb(v){if(!state.difficult.includes(v))state.difficult.push(v);state.practiceVerb=v;state.current=cards.find(c=>c.verb===v).id;state.selected=null;save();render()}
function practice(v){state.practiceVerb=v;state.current=cards.find(c=>c.verb===v).id;state.page='study';state.selected=null;save();render()}
function unmark(v){state.difficult=state.difficult.filter(x=>x!==v);save();render()}
function render(){document.documentElement.lang=state.lang==='pt'?'pt-BR':'en';$('language').value=state.lang;document.querySelectorAll('[data-label]').forEach(x=>x.textContent=({home:tr('Início','Home'),study:tr('Frases','Sentences'),review:tr('Revisões','Reviews'),verbs:tr('Verbos','Verbs')})[x.dataset.label]);let a=$('app');if(state.page==='home'){let done=Object.keys(state.rating).length;a.innerHTML='<div class="card"><h2>'+tr('Seu treino de inglês','Your English practice')+'</h2><p class="muted">'+tr('Frases técnicas, verbos no passado e repetição espaçada.','Technical sentences, past tense verbs and spaced repetition.')+'</p><div class="progress"><span style="width:'+done+'%"></span></div><p>'+done+'/100 '+tr('frases praticadas','sentences practiced')+'</p><p><b>'+countDue()+'</b> '+tr('frases disponíveis para revisão','sentences ready for review')+'</p><button class="primary" onclick="go(\'study\')">'+tr('Começar prática','Start practice')+'</button></div><div class="card"><h2>'+tr('Como funciona','How it works')+'</h2><p>'+tr('Toque na palavra para ver a fonética. Marque um verbo difícil para receber outras frases com ele. Avalie cada frase para agendar revisões.','Tap a word to see phonetics. Mark a difficult verb to get more examples. Rate each sentence to schedule reviews.')+'</p><p class="notice">'+tr('Tudo é salvo neste aparelho. A análise automática da pronúncia ainda não está disponível nesta versão. O áudio depende das vozes instaladas no Android.','Everything is saved on this device. Automatic pronunciation scoring is not yet available. Audio depends on installed Android voices.')+'</p></div>'}
else if(state.page==='study'){let c=cards[state.current];a.innerHTML=(state.practiceVerb!==null?'<div class="card"><div class="row spread"><b>'+tr('Treino intensivo: ','Focused practice: ')+verbs[state.practiceVerb].past+'</b><button onclick="state.practiceVerb=null;save();render()">'+tr('Sair','Exit')+'</button></div></div>':'')+cardView(c)}
else if(state.page==='review'){let dueCards=cards.filter(c=>due(c.id)&&state.rating[c.id]);a.innerHTML='<div class="card"><h2>'+tr('Revisões programadas','Scheduled reviews')+'</h2><p>'+dueCards.length+' '+tr('frases para revisar agora','sentences to review now')+'</p>'+(dueCards.length?dueCards.slice(0,30).map(c=>'<p><button onclick="state.current='+c.id+';state.page=\'study\';state.selected=null;save();render()">'+esc(c.text)+'</button></p>').join(''):'<p>'+tr('Nenhuma revisão pendente.','No reviews due.')+'</p>')+'</div>'}
else if(state.page==='verbs'){a.innerHTML='<div class="card"><h2>'+tr('Verbos difíceis','Difficult verbs')+'</h2><p class="muted small">'+tr('Toque em Praticar para ver 10 frases diferentes com o verbo.','Tap Practice to see 10 different sentences with each verb.')+'</p>'+verbs.map((v,i)=>'<div class="row spread" style="border-top:1px solid #edf0f4;padding:13px 0"><div><b>'+v.past+'</b><div class="muted small">'+v.phon+' · '+v.meaning+'</div></div><div class="row"><button onclick="practice('+i+')">'+tr('Praticar','Practice')+'</button>'+(state.difficult.includes(i)?'<button onclick="unmark('+i+')">★</button>':'<button onclick="markVerb('+i+')">☆</button>')+'</div></div>').join('')+'</div>'}}
render();
</script></body></html>
