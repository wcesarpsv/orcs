name: English Coach Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'english-coach/**'
      - '.github/workflows/english-coach-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-coach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK: $ANDROID_HOME"
      - run: npm install
      - run: npm run android:init
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EnglishCoach-debug-apk
          path: english-coach/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
